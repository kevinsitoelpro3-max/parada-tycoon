# Arma el paquete para Play Store (.aab) firmado con la llave de publicación.
# Se corre a mano desde la pestaña Actions → "Paquete para Play Store" → Run workflow.
# Necesita estos secretos del repositorio (Settings → Secrets and variables → Actions):
#   PLAY_KEYSTORE_BASE64   el archivo .jks convertido a base64
#   PLAY_KEYSTORE_PASSWORD contraseña del almacén
#   PLAY_KEY_ALIAS         alias de la llave (por ejemplo, parada)
#   PLAY_KEY_PASSWORD      contraseña de la llave
# La llave nunca se guarda en el repositorio: solo existe dentro de esta corrida.
name: Paquete para Play Store

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Revisar que estén los secretos
        env:
          KS: ${{ secrets.PLAY_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "Falta el secreto PLAY_KEYSTORE_BASE64. Lee docs/play-store.md." >&2
            exit 1
          fi

      - name: Instalar dependencias
        run: npm ci

      - name: Armar el juego y copiarlo a la app
        run: npm run android

      - name: Poner la llave de publicación (solo en esta corrida)
        working-directory: android
        env:
          KS: ${{ secrets.PLAY_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.PLAY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.PLAY_KEY_PASSWORD }}
        run: |
          echo "$KS" | base64 -d > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KS_PASS"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASS"
          } > keystore.properties

      - name: Construir el paquete .aab
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon
          cp app/build/outputs/bundle/release/app-release.aab ../parada-tycoon.aab

      - name: Borrar la llave
        if: always()
        working-directory: android
        run: rm -f release.jks keystore.properties

      - uses: actions/upload-artifact@v4
        with:
          name: parada-tycoon-play-store
          path: parada-tycoon.aab
